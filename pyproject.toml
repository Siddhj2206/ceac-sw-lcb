[project]
name = "ceac-sw-lcb"
version = "0.1.0"
description = "Simulator for Scalable Capability- and Energy-Aware Clustered SW-LCB in UAV-assisted emergency networks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Siddhant Jain" },
    { name = "Divyam Taparia" },
    { name = "Utsav Kesharwani" },
]
keywords = [
    "UAV",
    "emergency communication",
    "spectrum allocation",
    "multi-armed bandits",
    "SW-LCB",
    "clustering",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Simulation",
    "Topic :: System :: Networking",
]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "C4", "UP", "RUF", "ISC"]
ignore = ["RUF001"]
